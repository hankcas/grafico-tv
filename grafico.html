!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gráficos TV - Marcador y Cintillo</title>
<!--
  MINI PROYECTO: Gráficos para TV en HTML/CSS/JS
  - Resolución 1920x1080 (Full HD broadcast)
  - Fondo transparente (listo para CasparCG / OBS como "fuente navegador")
  - Datos desde un objeto JSON (simula una API en vivo)
  - Panel de control para operar el gráfico "en vivo"
  Tip: pon ?panel=0 en la URL para ocultar el panel al usarlo en OBS/CasparCG.
-->
<style>
  :root {
    --azul: #0a2a66;
    --azul-claro: #1e5bd8;
    --amarillo: #ffc800;
    --blanco: #ffffff;
    --fuente: "Segoe UI", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: transparent;   /* canal alfa: clave en broadcast */
    overflow: hidden;
    font-family: var(--fuente);
  }
  /* Vista previa: fondo de prueba para ver el gráfico (se quita en vivo) */
  body.preview { background: repeating-conic-gradient(#555 0 25%, #666 0 50%) 0 0 / 40px 40px; }

  /* Zona segura (title safe ~90%) */
  .safe { position: absolute; inset: 54px 96px; }

  /* ===== MARCADOR ===== */
  .marcador {
    position: absolute; top: 0; left: 0;
    display: flex; align-items: stretch; height: 64px;
    color: var(--blanco); font-weight: 700; font-size: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4);
    transform: translateY(-150%); opacity: 0;
    transition: transform .6s cubic-bezier(.2,.9,.3,1.2), opacity .4s;
  }
  .marcador.visible { transform: translateY(0); opacity: 1; }
  .equipo { background: var(--azul); padding: 0 24px; display: flex; align-items: center; gap: 12px; min-width: 150px; }
  .color { width: 10px; height: 40px; border-radius: 2px; }
  .goles { background: var(--blanco); color: var(--azul); width: 64px; display: grid; place-items: center; font-size: 36px; }
  .goles.cambio { animation: pulso .8s ease; }
  .reloj { background: var(--amarillo); color: var(--azul); padding: 0 22px; display: grid; place-items: center; min-width: 120px; font-variant-numeric: tabular-nums; }
  @keyframes pulso {
    0% { background: var(--amarillo); transform: scale(1.3); }
    100% { background: var(--blanco); transform: scale(1); }
  }

  /* ===== CINTILLO (lower third) ===== */
  .cintillo {
    position: absolute; bottom: 40px; left: 0;
    color: var(--blanco);
  }
  .cintillo .nombre, .cintillo .cargo {
    clip-path: inset(0 100% 0 0);
    transition: clip-path .6s cubic-bezier(.7,0,.2,1);
  }
  .cintillo .nombre {
    background: linear-gradient(90deg, var(--azul), var(--azul-claro));
    font-size: 48px; font-weight: 800; padding: 12px 36px;
    border-left: 12px solid var(--amarillo);
  }
  .cintillo .cargo {
    background: var(--blanco); color: var(--azul);
    font-size: 28px; font-weight: 600; padding: 8px 36px; display: inline-block;
    transition-delay: .25s;
  }
  .cintillo.visible .nombre, .cintillo.visible .cargo { clip-path: inset(0 0 0 0); }

  /* ===== PANEL DE CONTROL (no sale al aire) ===== */
  .panel {
    position: fixed; top: 20px; right: 20px; width: 380px;
    background: #1b1b1b; color: #eee; padding: 18px; border-radius: 10px;
    font-size: 16px; display: grid; gap: 10px;
  }
  .panel h3 { color: var(--amarillo); }
  .panel .fila { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel button, .panel input {
    padding: 8px 12px; border-radius: 6px; border: none; font-size: 15px;
  }
  .panel button { background: var(--azul-claro); color: #fff; cursor: pointer; }
  .panel button:hover { filter: brightness(1.2); }
  .panel input { flex: 1; min-width: 0; }
</style>
</head>
<body class="preview">

<div class="safe">
  <!-- Marcador -->
  <div class="marcador" id="marcador">
    <div class="equipo"><span class="color" id="colorLocal"></span><span id="local"></span></div>
    <div class="goles" id="golesLocal">0</div>
    <div class="goles" id="golesVisita">0</div>
    <div class="equipo"><span id="visita"></span><span class="color" id="colorVisita"></span></div>
    <div class="reloj" id="reloj">00:00</div>
  </div>

  <!-- Cintillo -->
  <div class="cintillo" id="cintillo">
    <div class="nombre" id="cNombre"></div>
    <div class="cargo" id="cCargo"></div>
  </div>
</div>

<!-- Panel de control -->
<div class="panel" id="panel">
  <h3>Panel de control</h3>
  <div class="fila">
    <button onclick="toggle('marcador')">Mostrar/Ocultar marcador</button>
    <button onclick="toggle('cintillo')">Mostrar/Ocultar cintillo</button>
  </div>
  <div class="fila">
    <button onclick="gol('local')">+1 Local</button>
    <button onclick="gol('visita')">+1 Visita</button>
    <button onclick="reloj.toggle()">Reloj ▶/⏸</button>
  </div>
  <div class="fila">
    <input id="inNombre" placeholder="Nombre">
    <input id="inCargo" placeholder="Cargo">
  </div>
  <button onclick="actualizarCintillo()">Actualizar cintillo</button>
  <button onclick="document.body.classList.toggle('preview')">Fondo de prueba on/off</button>
</div>

<script>
  // ===== DATOS (simulan la respuesta de una API) =====
  // En producción esto vendría de: fetch('https://api.../partido').then(r => r.json())
  const datos = {
    partido: {
      local:  { nombre: "BOG", color: "#e30613", goles: 0 },
      visita: { nombre: "MED", color: "#00a650", goles: 0 }
    },
    cintillo: { nombre: "Laura Gómez", cargo: "Periodista deportiva" }
  };

  const $ = id => document.getElementById(id);

  // Pinta los datos en pantalla
  function render() {
    const { local, visita } = datos.partido;
    $('local').textContent = local.nombre;
    $('visita').textContent = visita.nombre;
    $('colorLocal').style.background = local.color;
    $('colorVisita').style.background = visita.color;
    $('golesLocal').textContent = local.goles;
    $('golesVisita').textContent = visita.goles;
    $('cNombre').textContent = datos.cintillo.nombre;
    $('cCargo').textContent = datos.cintillo.cargo;
  }

  function toggle(id) { $(id).classList.toggle('visible'); }

  function gol(lado) {
    datos.partido[lado].goles++;
    render();
    const el = $(lado === 'local' ? 'golesLocal' : 'golesVisita');
    el.classList.remove('cambio'); void el.offsetWidth; el.classList.add('cambio');
  }

  function actualizarCintillo() {
    const n = $('inNombre').value.trim(), c = $('inCargo').value.trim();
    if (n) datos.cintillo.nombre = n;
    if (c) datos.cintillo.cargo = c;
    const cin = $('cintillo');
    // Animación de salida y entrada con el nuevo texto
    cin.classList.remove('visible');
    setTimeout(() => { render(); cin.classList.add('visible'); }, 650);
  }

  // Reloj de partido
  const reloj = {
    seg: 0, timer: null,
    toggle() {
      if (this.timer) { clearInterval(this.timer); this.timer = null; return; }
      this.timer = setInterval(() => {
        this.seg++;
        const m = String(Math.floor(this.seg / 60)).padStart(2, '0');
        const s = String(this.seg % 60).padStart(2, '0');
        $('reloj').textContent = `${m}:${s}`;
      }, 1000);
    }
  };

  // Modo "al aire": ?panel=0 oculta panel y fondo de prueba
  if (new URLSearchParams(location.search).get('panel') === '0') {
    $('panel').style.display = 'none';
    document.body.classList.remove('preview');
  }

  render();
</script>
</body>
</html>
